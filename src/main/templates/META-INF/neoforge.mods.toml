modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
logoFile = "logo.png"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Pipez Covers take their pipe's shape through a mixin, only applied when Pipez is installed
[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "create"
type = "required"
versionRange = "${create_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
# Optional: only for Aviator's Goggles in the head slot, which also needs Create Aeronautics
modId = "curios"
type = "optional"
versionRange = "${curios_version_range}"
ordering = "AFTER"
side = "BOTH"

# Optional: the goggles compat only switches on when Create Aeronautics is installed.
[[dependencies.${mod_id}]]
modId = "aeronautics"
type = "optional"
versionRange = "${aeronautics_version_range}"
ordering = "AFTER"
side = "BOTH"

# Optional: Pipez Covers, and Pipez feeding Blaze Burners.
[[dependencies.${mod_id}]]
modId = "pipez"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"
