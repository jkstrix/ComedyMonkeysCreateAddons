plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // Trade Bot's test courses, headless: builds each course, runs it, exits with the failures
        gameTestServer {
            type = "gameTestServer"
        }
        configureEach {
            // the mod's game tests are available in every run (/test in a dev world)
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // Unit tests run inside a bootstrapped FML (registries, items and blocks are available)
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

repositories {
    // Create, Ponder/Catnip, Flywheel, Registrate
    maven { name = 'Create'; url = 'https://maven.createmod.net' }
    // Curios API
    maven { name = 'Curios'; url = 'https://maven.theillusivec4.top/' }
    // JEI (dev runtime only, handy for checking recipes)
    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com' }
    exclusiveContent {
        forRepository {
            maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

configurations {
    sableJar
    // Tests compile against the same optional APIs (Create, Ponder, Pipez, Sable...) as the mod
    testCompileOnly.extendsFrom(compileOnly)
}

var extractSableCompanion = tasks.register('extractSableCompanion', Copy) {
    from({ zipTree(configurations.sableJar.singleFile) }) {
        include 'META-INF/jarjar/sable-companion-common-*.jar'
        eachFile { path = name }
    }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('sableCompanion')
}

dependencies {
    // Create API to compile against
    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_build}:slim") { transitive = false }
    compileOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}") { transitive = false }
    // Full Create release for running in dev (jar-in-jar bundles Flywheel, Ponder and Registrate)
    runtimeOnly("maven.modrinth:create:${create_modrinth_version}")

    // Curios is optional (Aviator's Goggles in the head slot); -PnoCurios leaves it out of dev runs to check that
    compileOnly("top.theillusivec4.curios:curios-neoforge:${curios_version}")
    if (!project.hasProperty('noCurios'))
        runtimeOnly("top.theillusivec4.curios:curios-neoforge:${curios_version}")

    // JEI: the Pressure Crucible recipe category (only loaded when JEI is installed)
    compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") { transitive = false }

    // ---- Optional mods, dev runtime only (none are needed to compile) ----
    // Pipez: Wellspring fluid capability + Blaze Burner feeding
    runtimeOnly("maven.modrinth:pipez:${pipez_version}")
    // ...and to compile the Pipez Covers against its pipe classes (optional at runtime)
    compileOnly("maven.modrinth:pipez:${pipez_version}") { transitive = false }
    // Create Aeronautics (+ Sable, which it requires): Aviator's Goggles in the Curios slot
    runtimeOnly("maven.modrinth:create-aeronautics:${aeronautics_version}")
    runtimeOnly("maven.modrinth:sable:${sable_version}")
    // Create: Liquid Fuel, to check it coexists with the Pipez Blaze Burner feeding
    runtimeOnly("maven.modrinth:create-liquid-fuel:${liquid_fuel_version}")
    // Carry On: picking up and placing upgraded chests and Wellsprings
    runtimeOnly("maven.modrinth:carry-on:${carry_on_version}")
    // Supplementaries (+ its Moonlight library): modded crops such as flax in the Auto Harvester
    runtimeOnly("maven.modrinth:supplementaries:${supplementaries_version}") { transitive = false }
    runtimeOnly("maven.modrinth:moonlight:${moonlight_version}") { transitive = false }

    // Inventory Profiles Next: only its annotations, to tell it how to treat upgraded chests (optional at runtime)
    compileOnly("maven.modrinth:inventory-profiles-next:vjuNnHLv") { transitive = false }
    // ...and in the dev client, with its libIPN and Kotlin for Forge, to test chest sorting against it
    runtimeOnly("maven.modrinth:inventory-profiles-next:vjuNnHLv") { transitive = false }
    runtimeOnly("maven.modrinth:libipn:BGe4KMlE") { transitive = false }
    runtimeOnly("maven.modrinth:kotlin-for-forge:uhJhCT7X") { transitive = false }

    // Sable API: the Compact Gyroscope and Torque Rotor act on physics objects (only registered when Sable is present)
    compileOnly("maven.modrinth:sable:${sable_version}") { transitive = false }
    sableJar("maven.modrinth:sable:${sable_version}") { transitive = false }
    // Sable's companion API ships inside the Sable jar; pulled out to compile against
    compileOnly(fileTree(layout.buildDirectory.dir('sableCompanion')) {
        include '*.jar'
        builtBy extractSableCompanion
    })
}

dependencies {
    testImplementation(platform('org.junit:junit-bom:5.10.2'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

tasks.named('test', Test) {
    useJUnitPlatform()
    maxHeapSize = '3G'
    testLogging { events 'failed'; exceptionFormat 'full' }
    // -PrunDisabled also runs the @Disabled tests that pin down known bugs (they should fail until fixed)
    if (project.hasProperty('runDisabled')) {
        systemProperty 'junit.jupiter.conditions.deactivate', 'org.junit.*DisabledCondition'
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range    : minecraft_version_range,
            neo_version_range          : neo_version_range,
            loader_version_range       : loader_version_range,
            create_version_range       : create_version_range,
            curios_version_range       : curios_version_range,
            aeronautics_version_range  : aeronautics_version_range,
            mod_id                     : mod_id,
            mod_name                   : mod_name,
            mod_license                : mod_license,
            mod_version                : mod_version,
            mod_authors                : mod_authors,
            mod_description            : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
